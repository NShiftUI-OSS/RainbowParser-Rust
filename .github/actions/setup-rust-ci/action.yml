name: setup-rust-ci
description: Rust 1.88, wasm32-unknown-unknown, wasm-pack, and Node 20
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.88.0"
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install wasm-pack
      shell: bash
      run: |
        set -euo pipefail
        version=0.15.0
        asset="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
        url="https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${asset}"
        tmp="$(mktemp -d)"
        curl -fsSL "$url" -o "${tmp}/wasm-pack.tar.gz"
        tar -xzf "${tmp}/wasm-pack.tar.gz" -C "$tmp"
        sudo install -m 755 "${tmp}/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
        wasm-pack --version
